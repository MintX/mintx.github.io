<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OverCrown</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* 데스크톱 시뮬레이터용: 캔버스가 브라우저 창 전체를 채운다.
         모바일 세로 강제(orientation lock / rotate-hint 오버레이 / PWA portrait)는
         일부러 넣지 않는다 — 가로 데스크톱 화면에서 4보드 멀티뷰를 그대로 보기 위함. */
      #unity-container {
        position: fixed;
        inset: 0;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>

    <!-- 빌드 도장. 자동 에러로그가 "어느 배포본에서 났는지"를 이 값으로 판별한다
         (Assets/Plugins/WebGL/ErrorReportBridge.jslib → server/src/build-stamp.js).
         빌드가 마커 자리를 채운다(WebGLBuilder.cs). 없으면 sim 에서 난 에러가 unknown 으로 가
         빌드를 되짚을 수 없다 — 2026-09-06 까지 실제로 그랬다. -->
    <script>
      window.__OC_BUILD = "sim@v0.5-10-g72c78d8@2026-09-06T14:05:02Z"; /* OC_BUILD_STAMP */
    </script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");

      const config = {
        arguments: [],
        dataUrl: "Build/sim.data.unityweb",
        frameworkUrl: "Build/sim.framework.js.unityweb",
        codeUrl: "Build/sim.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ovione",
        productName: "OverCrown",
        productVersion: "0.3",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      const script = document.createElement("script");
      script.src = "Build/sim.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config)
          .then(() => {})
          .catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
