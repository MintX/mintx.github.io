<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>OverCrown</title>

    <!-- PWA: Add to Home Screen (Android / iOS) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#15121f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <!-- iOS standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OverCrown" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* 캔버스는 뷰포트 전체를 채운다(풀사이즈). 안전영역 인셋은 CSS로 캔버스를 줄이지
         않고 Unity 내부에서 처리한다 — CSS로 캔버스를 인셋하면 Screen 크기가 바뀌어
         CanvasScaler(430×900) 스케일이 깨지기 때문. viewport-fit=cover(위 meta)는 유지해야
         .jslib가 env(safe-area-inset-*)를 읽을 수 있다. */
      #unity-container {
        position: fixed;
        inset: 0;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");

      const config = {
        arguments: [],
        dataUrl: "Build/v2_safe.data.unityweb",
        frameworkUrl: "Build/v2_safe.framework.js.unityweb",
        codeUrl: "Build/v2_safe.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ovione",
        productName: "OverCrown",
        productVersion: "0.1",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      const script = document.createElement("script");
      script.src = "Build/v2_safe.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config)
          .then(() => {})
          .catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>

    <script>
      // SafeArea 진단용: URL 끝에 #safe 를 붙이면 좌상단에 실제 env(safe-area-inset-*)
      // 값을 표시한다(모바일 PWA는 콘솔 접근이 어려워 화면 표시가 실용적). 기본은 꺼짐.
      if (location.hash.indexOf("safe") >= 0) {
        var saProbe = document.createElement("div");
        saProbe.style.cssText =
          "position:fixed;top:0;left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
        document.body.appendChild(saProbe);
        var saHud = document.createElement("div");
        saHud.style.cssText =
          "position:fixed;left:6px;top:6px;z-index:99999;font:12px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.75);padding:6px;pointer-events:none;white-space:pre";
        document.body.appendChild(saHud);
        var saUpdate = function () {
          var c = getComputedStyle(saProbe);
          saHud.textContent =
            "safe-area insets\nT:" + c.paddingTop + "  B:" + c.paddingBottom +
            "\nL:" + c.paddingLeft + "  R:" + c.paddingRight +
            "\nvw:" + window.innerWidth + " vh:" + window.innerHeight +
            " dpr:" + (window.devicePixelRatio || 1);
        };
        saUpdate();
        window.addEventListener("resize", saUpdate);
        setInterval(saUpdate, 1000);
      }
    </script>
  </body>
</html>
